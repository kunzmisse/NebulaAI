<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NebulaAI — DEV HACKERS</title>
<meta name="theme-color" content="#131314">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/main.css">
</head>
<body>
<div id="overlay" class="hidden"></div>

<aside id="sidebar">
  <div class="side-top">
    <div class="logo"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
    <div><b>NebulaAI</b><small>par DEV HACKERS</small></div>
    <button class="close" type="button" id="closeMenu" aria-label="Fermer le menu"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <nav>
    <button class="nav active" type="button" data-tab="chat"><i class="fa-solid fa-comments"></i>Discussion et IA</button>
    <button class="nav" type="button" data-tab="contact"><i class="fa-solid fa-envelope"></i>Contacter l'admin</button>
    <button class="nav" type="button" data-tab="admin"><i class="fa-solid fa-shield-halved"></i>Espace admin</button>
  </nav>
  <div class="hist-head"><span>Historique</span><button class="btn solid" type="button" id="newChat"><i class="fa-solid fa-plus"></i>Nouvelle</button></div>
  <div id="convList" class="conv-list"></div>
  <div class="side-foot"><span id="storeInfo">Stockage…</span><button class="btn danger" type="button" id="forget" title="Effacer la mémoire de NebulaAI" aria-label="Effacer la mémoire"><i class="fa-solid fa-brain"></i></button></div>
</aside>

<main>
  <header>
    <button class="burger" type="button" id="openMenu" aria-label="Ouvrir le menu"><i class="fa-solid fa-bars"></i></button>
    <h1>NebulaAI<span>DEV HACKERS</span></h1>
    <div class="status"><span class="dot"></span><span>Système actif</span></div>
  </header>

  <!-- Discussion -->
  <section id="panel-chat" class="panel">
    <div id="thread" aria-live="polite"></div>
    <div class="composer">
      <div class="card">
        <textarea id="userInput" rows="1" placeholder="Pose une question ou colle ton code ici…" aria-label="Message"></textarea>
        <div class="actions">
          <button class="btn send" type="button" data-mode="normal"><i class="fa-solid fa-paper-plane"></i>Envoyer</button>
          <button class="btn roast" type="button" data-mode="roast"><i class="fa-solid fa-fire"></i>Roaster</button>
          <button class="btn fix" type="button" data-mode="fix"><i class="fa-solid fa-wand-magic-sparkles"></i>Fix code</button>
        </div>
      </div>
      <p class="note">Entrée pour envoyer · Maj+Entrée pour un retour à la ligne</p>
    </div>
  </section>

  <!-- Contact -->
  <section id="panel-contact" class="panel page hidden">
    <div class="box">
      <h2><i class="fa-solid fa-headset"></i>Contacter l'administrateur</h2>
      <p>Un bug, une suggestion ou un problème ? Ton message arrive directement chez DEV HACKERS.</p>
      <textarea id="contactMsg" class="field" rows="5" maxlength="1000" placeholder="Ton message…"></textarea>
      <button class="btn solid" type="button" id="contactSend">Envoyer le message</button>
      <p id="contactFb" class="feedback hidden"></p>
    </div>
  </section>

  <!-- Admin -->
  <section id="panel-admin" class="panel page hidden">
    <div class="box adm">
      <h2><i class="fa-solid fa-shield-halved"></i>Console administrateur</h2>
      <div class="row">
        <input id="adminKey" class="field" type="password" placeholder="Clé administrateur" autocomplete="off">
        <button class="btn danger" type="button" id="adminLoad" style="padding:12px 20px">Charger</button>
      </div>
      <p id="adminFb" class="feedback hidden"></p>
      <div id="list"></div>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const thread = $("thread"), input = $("userInput");
const LABEL = { roast: "Roast", fix: "Fix" };
let conv = null, busy = false, auth = "";
try { auth = localStorage.getItem("nebula.auth") || ""; } catch {}

/* API authentifiée : chaque visiteur a un compte créé par le serveur */
async function initUser() {
  const r = await fetch("/api/user", { method: "POST" });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "Impossible de créer la session.");
  auth = d.userId + "." + d.token;
  try { localStorage.setItem("nebula.auth", auth); } catch {}
}
async function api(path, opts = {}, retry = true) {
  if (!auth) await initUser();
  const res = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", Authorization: "Bearer " + auth } });
  if (res.status === 401 && retry) { auth = ""; conv = null; await initUser(); return api(path, opts, false); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Erreur du serveur.");
  return data;
}

/* Navigation */
const sidebar = $("sidebar"), overlay = $("overlay");
const menu = open => { sidebar.classList.toggle("open", open); overlay.classList.toggle("hidden", !open); };
$("openMenu").onclick = () => menu(true);
$("closeMenu").onclick = overlay.onclick = () => menu(false);
document.querySelectorAll(".nav").forEach(b => b.onclick = () => {
  document.querySelectorAll(".nav").forEach(n => n.classList.toggle("active", n === b));
  ["chat", "contact", "admin"].forEach(t => $("panel-" + t).classList.toggle("hidden", t !== b.dataset.tab));
  menu(false);
});

/* Rendu des réponses (échappement HTML + blocs de code) */
const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function render(text) {
  return text.split(/```/).map((part, i) => {
    if (i % 2) {
      const m = part.match(/^([\w+#.-]*)\n/);
      const lang = m ? m[1] : "";
      const code = part.replace(/^[\w+#.-]*\n/, "").replace(/\n$/, "");
      return `<pre><div class="pre-head"><span>${esc(lang || "code")}</span><button type="button" data-copy>Copier</button></div><code>${esc(code)}</code></pre>`;
    }
    return esc(part).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>");
  }).join("");
}
const copy = async (text, btn, label) => {
  try { await navigator.clipboard.writeText(text); btn.textContent = "Copié"; setTimeout(() => btn.textContent = label, 1500); } catch {}
};

function hero() {
  thread.innerHTML = `<div class="hero"><div class="orb"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
    <h2>Bonjour, comment puis-je t'aider ?</h2>
    <p>Pose tes questions, discute de tout ou fais analyser ton code par l'IA.</p></div>`;
}

function add(role, html, { raw = "", mode = "" } = {}) {
  thread.querySelector(".hero")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + (role === "error" ? "ai error" : role);
  const tag = mode && mode !== "normal" ? `<span class="tag ${mode}">${LABEL[mode]}</span><br>` : "";
  el.innerHTML = role === "user"
    ? `<div class="body">${tag}${html}</div>`
    : `<div class="ava"><i class="fa-solid fa-wand-magic-sparkles"></i></div><div class="body">${html}</div>`;
  if (role === "ai" && raw) {
    const b = document.createElement("button");
    b.className = "copy"; b.type = "button"; b.textContent = "Copier la réponse";
    b.onclick = () => copy(raw, b, "Copier la réponse");
    el.querySelector(".body").appendChild(b);
  }
  el.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copy(b.closest("pre").querySelector("code").textContent, b, "Copier"));
  thread.appendChild(el);
  thread.scrollTop = thread.scrollHeight;
  return el;
}

async function sendMessage(mode) {
  const message = input.value.trim();
  if (!message || busy) return;
  busy = true;
  document.querySelectorAll(".actions .btn").forEach(b => b.disabled = true);
  input.value = ""; grow();
  add("user", esc(message).replace(/\n/g, "<br>"), { mode });
  const wait = add("ai", '<span class="dots"><i></i><i></i><i></i></span>');
  try {
    const data = await api("/api/chat", { method: "POST", body: JSON.stringify({ message, mode, conversationId: conv }) });
    wait.remove();
    conv = data.conversationId;
    add("ai", render(data.reply), { raw: data.reply });
    loadList();
  } catch (e) {
    wait.remove();
    add("error", esc(e.message || "Erreur de connexion au serveur."));
  } finally {
    busy = false;
    document.querySelectorAll(".actions .btn").forEach(b => b.disabled = false);
    input.focus();
  }
}

function grow() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; }
input.addEventListener("input", grow);
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage("normal"); } });
document.querySelectorAll(".actions .btn").forEach(b => b.onclick = () => sendMessage(b.dataset.mode));

/* Historique des discussions */
async function loadList() {
  try {
    const { conversations } = await api("/api/conversations");
    const box = $("convList"); box.replaceChildren();
    if (!conversations.length) { box.innerHTML = '<p class="conv-empty">Aucune discussion pour l\'instant.</p>'; return; }
    conversations.forEach(c => {
      const row = document.createElement("div"); row.className = "conv" + (c.id === conv ? " on" : "");
      const open = document.createElement("button"); open.type = "button"; open.textContent = c.title; open.onclick = () => openConv(c.id);
      const del = document.createElement("button"); del.type = "button"; del.className = "del"; del.setAttribute("aria-label", "Supprimer");
      del.innerHTML = '<i class="fa-solid fa-trash"></i>';
      del.onclick = async () => { await api("/api/conversations/" + c.id, { method: "DELETE" }); if (conv === c.id) newChat(); loadList(); };
      row.append(open, del); box.appendChild(row);
    });
  } catch {}
}
async function openConv(id) {
  try {
    const d = await api("/api/conversations/" + id);
    conv = id; thread.replaceChildren();
    d.messages.forEach(m => m.role === "user"
      ? add("user", esc(m.content).replace(/\n/g, "<br>"), { mode: m.mode })
      : add("ai", render(m.content), { raw: m.content }));
    document.querySelector('.nav[data-tab="chat"]').click(); menu(false); loadList();
  } catch (e) { add("error", esc(e.message)); }
}
function newChat() { conv = null; hero(); menu(false); loadList(); }
$("newChat").onclick = newChat;
$("forget").onclick = async () => {
  if (!confirm("Effacer ce que NebulaAI a retenu sur toi (prénom, notes…) ?")) return;
  try { await api("/api/memory", { method: "DELETE" }); add("ai", "Mémoire effacée."); } catch (e) { add("error", esc(e.message)); }
};

/* Contact */
function feedback(el, text, ok) { el.textContent = text; el.className = "feedback " + (ok ? "ok" : "ko"); }
$("contactSend").onclick = async () => {
  const msg = $("contactMsg").value.trim(), fb = $("contactFb");
  if (!msg) return feedback(fb, "Écris un message avant d'envoyer.", false);
  try {
    const res = await fetch("/api/contact", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: msg }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Échec de l'envoi.");
    $("contactMsg").value = "";
    feedback(fb, "Message envoyé à DEV HACKERS.", true);
  } catch (e) { feedback(fb, e.message, false); }
};

/* Admin (rendu en texte : aucun HTML injecté) */
const when = d => d ? new Date(d).toLocaleString("fr-FR") : "";
const section = (t) => { const e = document.createElement("h3"); e.className = "sec"; e.textContent = t; return e; };
$("adminLoad").onclick = async () => {
  const fb = $("adminFb"), list = $("list"), key = $("adminKey").value;
  try {
    const res = await fetch("/api/admin/data", { headers: { "x-admin-key": key } });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Accès refusé.");
    list.replaceChildren();
    feedback(fb, `Stockage : ${data.storage} · ${data.users} utilisateur(s) · ${data.messages.length} message(s) de contact · ${data.conversations.length} discussion(s)`, true);
    list.appendChild(section("Messages de contact"));
    if (!data.messages.length) { const p = document.createElement("p"); p.textContent = "Aucun message de contact."; list.appendChild(p); }
    data.messages.forEach(m => {
      const d = document.createElement("div"); d.className = "mail";
      const t = document.createElement("time"); t.textContent = when(m.date);
      d.append(t, document.createTextNode(m.message)); list.appendChild(d);
    });
    list.appendChild(section("Discussions des utilisateurs"));
    data.conversations.forEach(c => {
      const d = document.createElement("div"); d.className = "mail";
      const t = document.createElement("time"); t.textContent = `${when(c.updatedAt)} · ${c.count} messages · ${c.userId}`;
      const b = document.createElement("button"); b.type = "button"; b.className = "adm-title"; b.textContent = c.title;
      const body = document.createElement("div"); body.className = "hidden adm-body";
      b.onclick = async () => {
        if (!body.hasChildNodes()) {
          try {
            const r = await fetch("/api/admin/conversation?id=" + c.id, { headers: { "x-admin-key": key } });
            const j = await r.json();
            j.messages.forEach(m => { const l = document.createElement("p"); l.textContent = (m.role === "user" ? "Utilisateur : " : "NebulaAI : ") + m.content; body.appendChild(l); });
          } catch { body.textContent = "Lecture impossible."; }
        }
        body.classList.toggle("hidden");
      };
      d.append(t, b, body); list.appendChild(d);
    });
  } catch (e) { list.replaceChildren(); feedback(fb, e.message, false); }
};

hero();
fetch("/api/status").then(r => r.json()).then(s => {
  $("storeInfo").textContent = { github: "Stockage GitHub", local: "Stockage local", temporaire: "Stockage temporaire" }[s.storage] || "";
  if (s.reason) $("storeInfo").title = s.reason;
}).catch(() => {});
(async () => {
  await loadList();
  try {
    const { conversations } = await api("/api/conversations");
    if (conversations[0]) openConv(conversations[0].id);
  } catch {}
})();
</script>
</body>
</html>
